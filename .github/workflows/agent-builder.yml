name: LifelongCoaches Autonomous Agent Runner

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every night at 2:00 AM UTC while you sleep
  workflow_dispatch: # Allows you to manually trigger the agent run anytime from GitHub with one click

jobs:
  run-agents:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the cloud agent permission to commit code changes back to your repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Execute Autonomous Agent Routine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/agent_runner.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Autonomous cloud agents updated LifelongCoaches codebase"
          branch: main
